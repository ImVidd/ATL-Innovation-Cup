version: '3.8'
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./backend:/app"]
    command: uvicorn app.main:app --reload --host 0.0.0.0
  
  frontend:
    build: ./frontend
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["./frontend:/app"]
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on: [backend]